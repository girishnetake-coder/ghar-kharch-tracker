
<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>घरखर्च वही</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Noto Sans Devanagari','Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#dfe9f3 0%,#eef1f6 50%,#d9e4f0 100%);color:#1b1b1b;padding-bottom:60px;perspective:1200px}

header{background:linear-gradient(145deg,#2196f3,#0d47a1);color:#fff;padding:16px;text-align:center;font-size:21px;font-weight:800;position:sticky;top:0;z-index:20;letter-spacing:.5px;
  box-shadow:0 6px 20px rgba(13,71,161,.45), inset 0 1px 0 rgba(255,255,255,.25), inset 0 -2px 6px rgba(0,0,0,.25);
  text-shadow:0 2px 4px rgba(0,0,0,.35);border-bottom:2px solid #0a3d91}

.monthbar{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(145deg,#ffffff,#e8eef7);padding:11px 14px;position:sticky;top:56px;z-index:19;
  box-shadow:0 4px 12px rgba(13,71,161,.18), inset 0 1px 0 #fff, inset 0 -2px 4px rgba(0,0,0,.06);
  border-bottom:1px solid #c9d6e8}
.monthbar span{font-weight:800;font-size:17px;color:#0d47a1;text-shadow:0 1px 1px rgba(255,255,255,.8)}
.monthbar button{border:none;background:linear-gradient(145deg,#e3f2fd,#bbdefb);color:#0d47a1;font-size:18px;width:42px;height:42px;border-radius:50%;cursor:pointer;font-weight:800;
  box-shadow:0 4px 10px rgba(13,71,161,.3), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 4px rgba(0,0,0,.1);transition:.1s}
.monthbar button:active{transform:translateY(2px);box-shadow:0 1px 3px rgba(13,71,161,.3), inset 0 2px 4px rgba(0,0,0,.15)}

.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:14px}
.card{background:linear-gradient(145deg,#ffffff,#eef3fa);border-radius:16px;padding:14px;
  box-shadow:0 6px 16px rgba(13,71,161,.15), inset 0 1px 0 #fff, inset 0 -3px 6px rgba(0,0,0,.05);
  border:1px solid rgba(255,255,255,.8)}
.card .lbl{font-size:12px;color:#666;margin-bottom:6px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.card .val{font-size:22px;font-weight:900;text-shadow:0 1px 1px rgba(255,255,255,.7)}
.card.full{grid-column:1/-1;background:linear-gradient(145deg,#4caf50,#1b5e20);color:#fff;
  box-shadow:0 8px 22px rgba(27,94,32,.45), inset 0 2px 0 rgba(255,255,255,.25), inset 0 -3px 8px rgba(0,0,0,.25);
  border:1px solid rgba(255,255,255,.15)}
.card.full .lbl{color:#d7f5d9}
.card.full .val{font-size:30px;text-shadow:0 2px 4px rgba(0,0,0,.35)}
.green{color:#2e7d32}.red{color:#c62828}.blue{color:#1565c0}.orange{color:#e65100}

.section{background:linear-gradient(145deg,#ffffff,#f1f5fb);margin:14px;border-radius:18px;padding:16px;
  box-shadow:0 8px 22px rgba(13,71,161,.13), inset 0 1px 0 #fff, inset 0 -3px 8px rgba(0,0,0,.05);
  border:1px solid rgba(255,255,255,.9)}

.section h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px;color:#1a237e;font-weight:800;
  text-shadow:0 1px 1px rgba(255,255,255,.8)}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:0 2px 4px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.5)}

.sec-head{display:flex;align-items:center;justify-content:space-between;cursor:pointer;user-select:none;
  padding:4px 0;margin:-4px 0 8px}
.sec-head h3{margin:0}
.toggle-btn{border:none;background:linear-gradient(145deg,#e3f2fd,#bbdefb);color:#0d47a1;
  font-size:13px;font-weight:800;padding:7px 14px;border-radius:20px;cursor:pointer;font-family:inherit;
  box-shadow:0 3px 8px rgba(13,71,161,.25), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 4px rgba(0,0,0,.08);
  transition:.15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.toggle-btn:active{transform:translateY(2px);box-shadow:0 1px 3px rgba(13,71,161,.25), inset 0 2px 4px rgba(0,0,0,.12)}
.toggle-btn.open{background:linear-gradient(145deg,#ffe0b2,#ffcc80);color:#e65100}
.toggle-btn .arrow{display:inline-block;transition:transform .25s}
.toggle-btn.open .arrow{transform:rotate(180deg)}
.sec-body{overflow:hidden;transition:max-height .35s ease,opacity .25s ease;max-height:5000px;opacity:1}
.sec-body.collapsed{max-height:0;opacity:0;margin-top:0}

.row{display:flex;gap:8px;margin-bottom:10px}
input,select{flex:1;min-width:0;padding:12px;border:1.5px solid #cfd8dc;border-radius:12px;font-size:16px;font-family:inherit;
  background:linear-gradient(145deg,#ffffff,#f5f8fc);box-shadow:inset 0 2px 4px rgba(0,0,0,.06), inset 0 -1px 0 #fff;transition:.15s}
input:focus,select:focus{outline:none;border-color:#1e88e5;background:#fff;box-shadow:inset 0 2px 5px rgba(30,136,229,.15), 0 0 0 3px rgba(30,136,229,.12)}
input.amt{flex:0 0 110px;text-align:right;font-weight:800}
.mic{flex:0 0 48px;border:none;border-radius:12px;background:linear-gradient(145deg,#fff8e1,#ffe0b2);color:#e65100;font-size:20px;cursor:pointer;border:1.5px solid #ffcc80;
  box-shadow:0 3px 8px rgba(230,81,0,.2), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 4px rgba(0,0,0,.08);transition:.15s}
.mic:active{transform:translateY(2px);box-shadow:0 1px 3px rgba(230,81,0,.2), inset 0 2px 4px rgba(0,0,0,.12)}
.mic.rec{background:linear-gradient(145deg,#ff5252,#d32f2f);color:#fff;border-color:#d32f2f;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.75;transform:scale(1.03)}}

.btn{width:100%;padding:14px;border:none;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;letter-spacing:.3px;transition:.12s}
.btn-add{background:linear-gradient(145deg,#42a5f5,#1565c0);color:#fff;
  box-shadow:0 5px 14px rgba(21,101,192,.4), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.2);
  text-shadow:0 1px 2px rgba(0,0,0,.3)}
.btn-add:active{transform:translateY(3px);box-shadow:0 1px 4px rgba(21,101,192,.4), inset 0 3px 6px rgba(0,0,0,.25)}
.btn-big{background:linear-gradient(145deg,#ffa726,#e65100);color:#fff;font-size:17px;padding:17px;margin:0 14px;width:calc(100% - 28px);border-radius:16px;
  box-shadow:0 7px 20px rgba(230,81,0,.45), inset 0 2px 0 rgba(255,255,255,.3), inset 0 -4px 8px rgba(0,0,0,.25);
  text-shadow:0 2px 3px rgba(0,0,0,.3);font-weight:800;letter-spacing:.5px}
.btn-big:active{transform:translateY(4px);box-shadow:0 2px 6px rgba(230,81,0,.45), inset 0 4px 8px rgba(0,0,0,.3)}

ul.list{list-style:none;margin:10px 0 0;padding:0;max-height:250px;overflow-y:auto}
ul.list li{display:flex;align-items:center;gap:8px;padding:11px 6px;border-bottom:1px solid #e8eef7;font-size:15px}
ul.list li:last-child{border-bottom:none}
.nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.dt{font-size:11px;color:#999;margin-right:4px}
.am{font-weight:800;white-space:nowrap;text-shadow:0 1px 1px rgba(255,255,255,.7)}
.del{border:none;background:none;color:#ef9a9a;font-size:20px;cursor:pointer;padding:0 6px;font-weight:800}
.empty{text-align:center;color:#aaa;font-size:14px;padding:14px}

#todayPanel{display:none;margin:14px;background:linear-gradient(145deg,#fff,#fff8e1);border-radius:18px;padding:18px;
  box-shadow:0 10px 28px rgba(230,81,0,.25), inset 0 1px 0 #fff, inset 0 -3px 8px rgba(0,0,0,.05);
  border-top:5px solid #fb8c00}
#todayPanel h3{margin:0 0 12px;font-size:17px;color:#e65100;font-weight:800}
.sumrow{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px dashed #e0e0e0;font-size:16px}
.sumrow:last-child{border-bottom:none}
.sumrow b{font-size:18px}
.big-bal{background:linear-gradient(145deg,#c8e6c9,#a5d6a7);border-radius:12px;padding:16px;text-align:center;margin-top:12px;
  box-shadow:inset 0 3px 8px rgba(0,0,0,.12), inset 0 -1px 0 rgba(255,255,255,.6), 0 4px 12px rgba(46,125,50,.25)}
.big-bal .l{font-size:13px;color:#2e4a2f;font-weight:700}
.big-bal .v{font-size:32px;font-weight:900;color:#1b5e20;text-shadow:0 2px 3px rgba(255,255,255,.7)}

.loan{background:linear-gradient(145deg,#fff8e1,#ffecb3);border-radius:14px;padding:14px;margin-bottom:12px;border-left:5px solid #ff9800;
  box-shadow:0 6px 16px rgba(230,81,0,.18), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -2px 5px rgba(0,0,0,.06)}
.loan .lname{font-weight:800;font-size:16px;color:#4e342e;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;text-shadow:0 1px 1px rgba(255,255,255,.7)}
.loan .lname .del{color:#e57373}
.lrow{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.lrow b{font-weight:800}
.lbal{background:linear-gradient(145deg,#ffe0b2,#ffcc80);border-radius:10px;padding:10px 12px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:15px;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.1), inset 0 -1px 0 rgba(255,255,255,.5)}
.lbal b{font-size:19px;color:#e65100;text-shadow:0 1px 1px rgba(255,255,255,.6)}
.payrow{display:flex;gap:6px;margin-top:10px}
.payrow input{flex:1;padding:9px;font-size:14px}
.payrow button{background:linear-gradient(145deg,#ffb74d,#f57c00);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;
  box-shadow:0 4px 10px rgba(230,81,0,.35), inset 0 1px 0 rgba(255,255,255,.4), inset 0 -2px 4px rgba(0,0,0,.15);transition:.12s;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.payrow button:active{transform:translateY(2px);box-shadow:0 1px 3px rgba(230,81,0,.35), inset 0 2px 4px rgba(0,0,0,.2)}
.paylog{font-size:12px;color:#666;margin-top:8px;max-height:90px;overflow-y:auto}
.paylog div{padding:3px 0;border-bottom:1px dotted #ddd}
.progress{height:8px;background:linear-gradient(145deg,#ffe0b2,#ffcc80);border-radius:5px;margin-top:8px;overflow:hidden;
  box-shadow:inset 0 2px 4px rgba(0,0,0,.15)}
.progress div{height:100%;background:linear-gradient(145deg,#66bb6a,#2e7d32);transition:width .4s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 0 8px rgba(76,175,80,.5)}

.backup-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.btn-backup,.btn-restore,.btn-excel{padding:14px;border:none;border-radius:12px;font-weight:800;font-size:14px;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:.12s;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.btn-backup{background:linear-gradient(145deg,#26c6da,#00838f);color:#fff;box-shadow:0 5px 14px rgba(0,131,143,.4), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.2)}
.btn-backup:active{transform:translateY(3px);box-shadow:0 1px 4px rgba(0,131,143,.4), inset 0 3px 6px rgba(0,0,0,.25)}
.btn-restore{background:linear-gradient(145deg,#9ccc65,#558b2f);color:#fff;box-shadow:0 5px 14px rgba(85,139,47,.4), inset 0 1px 0 rgba(255,255,255,.35), inset 0 -3px 6px rgba(0,0,0,.2)}
